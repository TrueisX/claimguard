apiVersion: apps/v1
kind: Deployment
metadata:
  name: claimguard-web
  namespace: claimguard
  labels: {app: claimguard-web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: claimguard-web}
  template:
    metadata:
      labels: {app: claimguard-web}
    spec:
      containers:
        - name: web
          image: claimguard-web:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: claimguard-config}
            - secretRef: {name: claimguard-secrets}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
